 <!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <title>SIGAC | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="login-wrapper">
    <div class="login-box">

      <h1>Universidade Rovuma</h1>
      <h2>Direcção Científica</h2>
      <h3>Sistema de Gestão de Actividades Científicas (SIGAC)</h3>

      <p class="login-info">Autentique-se para aceder ao sistema</p>

      <form>
        <input
          type="email"
          id="email"
          placeholder="Email"
          autofocus
          required
        >

        <input
          type="password"
          placeholder="Password"
          required
        >

        <button type="submit">ENTRAR</button>
      </form>

    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
