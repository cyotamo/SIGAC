<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Sistema Integrado de Gestão de Actividades Científicas - SIGAC</title>
  <meta name="description" content="SIGAC — Sistema Integrado de Gestão de Actividades Científicas da Universidade Rovuma." />

  <link rel="canonical" href="https://sigacur00.web.app/" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logo.png" />

  <!-- Open Graph (WhatsApp/Facebook) -->
  <meta property="og:title" content="Sistema Integrado de Gestão de Actividades Científicas - SIGAC" />
  <meta property="og:description" content="Plataforma da Universidade Rovuma para a gestão de actividades científicas." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sigacur00.web.app/" />
  <meta property="og:image" content="https://sigacur00.web.app/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/png" />

  <!-- Twitter Card (também ajuda alguns crawlers) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sistema Integrado de Gestão de Actividades Científicas - SIGAC" />
  <meta name="twitter:description" content="Plataforma da Universidade Rovuma para a gestão de actividades científicas." />
  <meta name="twitter:image" content="https://sigacur00.web.app/assets/og-image.png" />

  <script>

    (() => {
      const allowedOrigin = 'https://sigacur00.web.app';
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

      if (window.location.origin !== allowedOrigin && !isLocalhost) {
        window.location.replace('https://sigacur00.web.app/');
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <main class="page">
    <section class="card" aria-label="Login SIGAC">

      <header class="brand">
        <div class="brand-text">
          <h1>Universidade Rovuma</h1>
          <p class="dept">Direcção Científica</p>
          <p class="sys">Sistema Integrado de Gestão de Actividades Científicas (SIGAC)</p>
        </div>
      </header>

      <p class="hint">Autentique-se para aceder ao sistema</p>

      <form class="form" autocomplete="on">
        <label class="field">
          <span>E-mail</span>
          <input id="email" type="email" placeholder="ex.: gestor@unirovuma.ac.mz" required />
        </label>

        <label class="field">
          <span>Palavra-passe</span>
          <input id="senha" type="password" placeholder="Introduza a palavra-passe" required />
        </label>

        <button class="btn" type="submit">ENTRAR</button>
      </form>

      <footer class="footer">
        <span>© <span id="ano"></span> Universidade Rovuma</span>
      </footer>
    </section>
  </main>

  <script type="module" src="/login.js"></script>
</body>
</html>
