<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Sistema Integrado de Gestão de Actividades Científicas - SIGAC</title>
  <meta name="description" content="SIGAC — Sistema Integrado de Gestão de Actividades Científicas da Universidade Rovuma." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f3d8a" />

  <!-- Open Graph (WhatsApp/Facebook) -->
  <meta property="og:title" content="Sistema Integrado de Gestão de Actividades Científicas - SIGAC" />
  <meta property="og:description" content="Plataforma da Universidade Rovuma para a gestão de actividades científicas." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/og-image-v2.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/png" />

  <!-- Twitter Card (também ajuda alguns crawlers) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sistema Integrado de Gestão de Actividades Científicas - SIGAC" />
  <meta name="twitter:description" content="Plataforma da Universidade Rovuma para a gestão de actividades científicas." />
  <meta name="twitter:image" content="assets/og-image-v2.png" />

  <script>
    (() => {
      const currentUrl = new URL(window.location.href);
      const normalized = `${currentUrl.origin}${currentUrl.pathname}`;

      const canonical = document.createElement("link");
      canonical.rel = "canonical";
      canonical.href = normalized;
      document.head.appendChild(canonical);

      const ogUrl = document.createElement("meta");
      ogUrl.setAttribute("property", "og:url");
      ogUrl.content = normalized;
      document.head.appendChild(ogUrl);
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="page">
    <section class="card" aria-label="Login SIGAC">

      <header class="brand">
        <div class="brand-text">
          <h1>Universidade Rovuma</h1>
          <p class="dept">Direcção Científica</p>
          <p class="sys">Sistema Integrado de Gestão de Actividades Científicas (SIGAC)</p>
        </div>
      </header>

      <p class="hint">Autentique-se para aceder ao sistema</p>

      <form class="form" autocomplete="on">
        <label class="field">
          <span>E-mail</span>
          <input id="email" type="email" placeholder="ex.: gestor@unirovuma.ac.mz" required />
        </label>

        <label class="field">
          <span>Palavra-passe</span>
          <input id="senha" type="password" placeholder="Introduza a palavra-passe" required />
        </label>

        <button class="btn" type="submit">ENTRAR</button>
      </form>

      <footer class="footer">
        <span>© <span id="ano"></span> Universidade Rovuma</span>
      </footer>
    </section>
  </main>

  <script type="module" src="login.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js");
      });
    }
  </script>
</body>
</html>
